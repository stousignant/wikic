[project]
name = "wikic"
version = "0.1.0"
description = "Deterministic CLI compiler and doctor for agent-readable Markdown/LLM wikis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["markdown", "llm-wiki", "knowledge-base", "cli", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
wikic = "wikic.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikic"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
