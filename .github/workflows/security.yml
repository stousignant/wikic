name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Detector sets grow over time; a weekly pass catches secrets that were
    # unrecognised when they were first committed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRUFFLEHOG_VERSION: "3.97.4"
  TRUFFLEHOG_SHA256: "dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scanners audit the repository, not the working tree. Shallow
          # checkout would hide every commit but the last.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL -o gitleaks.tar.gz \
            "${base}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Install trufflehog
        run: |
          set -euo pipefail
          base="https://github.com/trufflesecurity/trufflehog/releases/download"
          curl -sSfL -o trufflehog.tar.gz \
            "${base}/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum -c -
          tar -xzf trufflehog.tar.gz trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog

      - name: gitleaks (every ref, full history)
        run: |
          set -euo pipefail
          # Even redacted findings may contain sensitive paths or context.
          # Never copy scanner diagnostics into public logs or artifacts.
          status=0
          gitleaks git --redact --log-opts="--all" . >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Credential scan blocked publication; inspect locally."
            exit "$status"
          fi
          echo "Credential history scan passed."

      - name: trufflehog (verified and unverifiable)
        run: |
          set -euo pipefail
          umask 077
          findings=$(mktemp)
          trap 'rm -f "$findings"' EXIT
          # Unknown results also fail: an unreachable verifier is not clean.
          # Raw output never reaches public logs or uploaded artifacts.
          status=0
          trufflehog git file://. --results=verified,unknown --json --fail --no-update \
            >"$findings" 2>/dev/null || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Verification scan failed or found credentials; inspect locally."
            exit "$status"
          fi
          if [ -s "$findings" ]; then
            echo "::error::Verification scan returned findings; inspect locally."
            exit 1
          fi
          echo "Credential verification scan passed."

      - name: Identity and path sweep
        # Private patterns belong to the local publication gate, never PR code.
        run: python3 scripts/leak_sweep.py --history --credentials
