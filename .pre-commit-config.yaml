# Convenience definitions for explicit/manual pre-commit runs.
# Installed publication gates are generated by install_publication_hooks.py from
# a reviewed snapshot in the shared Git directory; this file is not their manager.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        alias: publication-sweep-staged-credentials
        name: safely detect staged credentials
        entry: python3 scripts/leak_sweep.py --staged --credentials
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks
        alias: publication-sweep-text
        name: safely scan local publication prose
        entry: python3 scripts/leak_sweep.py --text-file-env
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: gitleaks
        alias: publication-sweep-push
        name: safely scan exact outgoing publication objects
        entry: python3 scripts/leak_sweep.py --pre-push --credentials
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: leak-sweep
        name: staged identity and path sweep
        entry: python3 scripts/leak_sweep.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
