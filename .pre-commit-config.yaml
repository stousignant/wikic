# Install once with:
#   uv tool install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: detect staged credentials
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: scan repository history before push
        entry: gitleaks git --redact --log-opts=--all .
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: leak-sweep
        name: identity and path sweep
        entry: python3 scripts/leak_sweep.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: leak-sweep-history
        name: identity, path, and commit-message sweep before push
        entry: python3 scripts/leak_sweep.py --messages
        language: system
        pass_filenames: false
        stages: [pre-push]
